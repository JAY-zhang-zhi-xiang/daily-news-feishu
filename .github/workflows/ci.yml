name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Byte-compile sources
        run: python -m py_compile src/main.py tests/test_main.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check test coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate configuration in check mode
        run: python src/main.py --check-config
        env:
          DEEPSEEK_API_KEY: sk-ci-placeholder-not-used-for-requests
          FEISHU_WEBHOOK_URL: https://open.feishu.cn/open-apis/bot/v2/hook/ci-placeholder-token
          RSS_FEEDS: https://example.com/rss.xml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for committed credentials
        run: |
          set -euo pipefail
          pattern='sk-[A-Za-z0-9]{20,}|open-apis/bot/v2/hook/[0-9a-fA-F-]{20,}'
          if matches=$(grep -rInE "$pattern" . \
              --exclude-dir=.git --exclude-dir=.venv --exclude-dir=data \
              --exclude='.env' --exclude='*.pyc' --exclude='*.log'); then
            echo "$matches"
            echo "::error::Possible committed secret found in the working tree."
            exit 1
          fi
          echo "No committed credentials detected."
